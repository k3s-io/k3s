---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cgi-bin
data:
  ip: |
    #!/bin/sh
    cat <<EOF
    Content-Type: text/plain

    $REMOTE_ADDR
    EOF
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-loadbalancer-ext
spec:
  selector:
    matchLabels:
      k8s-app: nginx-app-loadbalancer-ext
  replicas: 1
  template:
    metadata:
      labels:
        k8s-app: nginx-app-loadbalancer-ext
    spec:
      containers:
      - name: nginx
        image: ghcr.io/k3s-io/mirrored-library-busybox:1.37.0
        args: ['sh', '-c', 'echo Welcome to nginx! > index.html; hostname > name.html; httpd -vvf']
        ports:
        - containerPort: 80
        volumeMounts:
        - name: cgi-bin
          mountPath: /cgi-bin
      volumes:
      - name: cgi-bin
        configMap:
          name: cgi-bin
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
 name: nginx-loadbalancer-svc-ext
 labels:
   k8s-app: nginx-app-loadbalancer-ext
spec:
 type: LoadBalancer
 externalTrafficPolicy: Local
 ports:
 - port: 82
   targetPort: 80
   protocol: TCP
   name: http
 selector:
   k8s-app: nginx-app-loadbalancer-ext
