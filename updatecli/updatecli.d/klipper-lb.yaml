---
name: "Bump Klipper LB version"
pipelineid: "k3s-io"
scms:
  k3s:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      username: "{{ .github.username }}"
      token: "{{ requiredEnv .github.token }}"
      owner: '{{ requiredEnv .github.org }}'
      repository: '{{ requiredEnv .github.repo }}'
      branch: '{{ requiredEnv .github.branch }}'
  klipper-lb:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      username: "{{ .github.username }}"
      token: "{{ requiredEnv .github.token }}"
      owner: "{{ .k3s.org }}"
      repository: "{{ .klipper_lb.repo }}"
      branch: "{{ .klipper_lb.branch }}"

actions:
  github:
    title: "[{{ requiredEnv .github.branch }}] Bump k3s-io images"
    kind: "github/pullrequest"
    scmid: "k3s"
    spec:
      merge:
        strategy: "manual"
      mergemethod: "squash"
      labels:
        - "dependencies"

sources:
  klipper-lb:
    name: "Get Klipper LB latest release version"
    kind: "githubrelease"
    spec:
      owner: "{{ .klipper_lb.org }}"
      repository: "{{ .klipper_lb.repo }}"
      branch: "{{ .klipper_lb.branch }}"
      token: "{{ requiredEnv .github.token }}"
      versionfilter:
        kind: "latest"

conditions:
  klipper-lb:
    name: "Check rancher/klipper-lb image version in DockerHub"
    kind: "dockerimage"
    sourceid: "klipper-lb"
    spec:
      image: "rancher/klipper-lb"

targets:
  klipper-lb:
    name: 'Bump klipper-lb image to {{ source "klipper-lb" }}'
    kind: "file"
    scmid: "k3s"
    sourceid: "klipper-lb"
    spec:
      files:
        - "pkg/cloudprovider/servicelb.go"
        - "scripts/airgap/image-list.txt"
      matchpattern: 'rancher/klipper-lb:v\d+\.\d+\.\d+(-\w+)?'
      replacepattern: 'rancher/klipper-lb:{{ source "klipper-lb" }}'
