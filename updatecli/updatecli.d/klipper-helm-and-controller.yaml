---
name: "Bump Klipper Helm and Helm Controller version"
scms:
  k3s:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      username: "{{ .github.username }}"
      token: "{{ requiredEnv .github.token }}"
      owner: '{{ requiredEnv .github.org }}'
      repository: '{{ requiredEnv .github.repo }}'
      branch: '{{ requiredEnv .github.branch }}'
      commitmessage:
        title: "Bump Klipper Helm and Helm Controller version"
  helm-controller:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      username: "{{ .github.username }}"
      token: "{{ requiredEnv .github.token }}"
      owner: "{{ .helm_controller.org }}"
      repository: "{{ .helm_controller.repo }}"
      branch: "{{ .helm_controller.branch }}"

actions:
  github:
    title: "[{{ requiredEnv .github.branch }}] Bump Klipper Helm and Helm Controller version"
    kind: "github/pullrequest"
    scmid: "k3s"
    spec:
      merge:
        strategy: "manual"
      mergemethod: "squash"
      usetitleforautomerge: true
      parent: false
      labels: 
        - "dependencies"

sources:
  helm-controller:
    name: "Get Helm Controller latest release version"
    kind: "githubrelease"
    spec:
      owner: "{{ .helm_controller.org }}"
      repository: "{{ .helm_controller.repo }}"
      branch: "{{ .helm_controller.branch }}"
      token: "{{ requiredEnv .github.token }}"
      versionfilter:
        kind: "semver"
        pattern: '{{ requiredEnv .helm_controller.version_pattern }}'
  klipper-helm:
    name: "Get Klipper Helm latest release version"
    kind: "githubrelease"
    spec:
      owner: "{{ .klipper_helm.org }}"
      repository: "{{ .klipper_helm.repo }}"
      branch: "{{ .klipper_helm.branch }}"
      token: "{{ requiredEnv .github.token }}"
      typefilter:
        latest: true
  get-pwd:
    name: "Run Updatecli execution directory"
    kind: "shell"
    disablesourceinput: true
    spec:
      command: 'pwd'
      environments:
        - name: PATH

conditions:
  klipper-helm:
    name: "Check rancher/klipper-helm image version in DockerHub"
    kind: "dockerimage"
    sourceid: "klipper-helm"
    spec:
      image: "rancher/klipper-helm"
  helm-controller:
    name: "Check Helm Controller usage in go.mod"
    kind: "file"
    scmid: "k3s"
    disablesourceinput: true
    spec:
      file: "go.mod"
      matchpattern: 'github.com/k3s-io/helm-controller'

targets:
  go-mod:
    name: "Run go mod update"
    kind: "shell"
    scmid: "k3s"
    disablesourceinput: true
    spec:
      command: '{{ source "get-pwd" }}/updatecli/scripts/run-go-mod-update.sh github.com/k3s-io/helm-controller@{{ source "helm-controller" }}'
      environments:
        - name: PATH
        - name: HOME
  klipper-helm:
    name: "Update rancher/klipper-helm image version"
    kind: "file"
    scmid: "k3s"
    sourceid: "klipper-helm"
    spec:
      file: "scripts/airgap/image-list.txt"
      matchpattern: 'rancher/klipper-helm:v\d+\.\d+\.\d+(-\w+)?'
      replacepattern: 'rancher/klipper-helm:{{ source "klipper-helm" }}'
  versionfile:
    name: "Bump to latest klipper-helm version in scripts/version.sh"
    kind: "file"
    scmid: "k3s"
    sourceid: "klipper-helm"
    spec:
      file: "scripts/version.sh"
      matchpattern: '(?m)^VERSION_HELM_JOB=(.*)'
      replacepattern: 'VERSION_HELM_JOB="{{ source "klipper-helm" }}"'

