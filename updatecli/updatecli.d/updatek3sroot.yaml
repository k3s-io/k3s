---
name: "Update k3sroot version" 
pipelineid: "k3s-dependencies"

sources:
 k3sroot:
   name: Get k3s-root version
   kind: githubrelease
   spec:
     owner: k3s-io
     repository: k3s-root
     token: '{{ requiredEnv .github.token }}'
     typefilter:
       release: true
       draft: false
       prerelease: false
     versionfilter:
       kind: semver
       # pattern accepts any semver constraint
       pattern: "*"

targets:
  versionfile:
    name: "[{{ requiredEnv .github.branch }}] Bump to latest k3s-root version in scripts/version.sh"
    kind: file
    scmid: default
    sourceid: k3sroot
    spec:
      file: "scripts/version.sh"
      matchpattern: '(?m)^VERSION_ROOT=(.*)'
      replacepattern: 'VERSION_ROOT="{{ source "k3sroot" }}"'
 

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ requiredEnv .github.org }}'
      repository: '{{ requiredEnv .github.repo }}'
      branch: '{{ requiredEnv .github.branch }}'
      commitmessage:
        title: "Bump k3s-root version"
      
actions:
  github:
    title: "[{{ requiredEnv .github.branch }}] Bump bundled dependencies"
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      merge:
        strategy: "manual"
      mergemethod: "squash"
      labels:
        - "dependencies"

