---
name: "Bump Local Path Provisioner version"
scms:
  k3s:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      username: "{{ .github.username }}"
      token: "{{ requiredEnv .github.token }}"
      owner: '{{ requiredEnv .github.org }}'
      repository: '{{ requiredEnv .github.repo }}'
      branch: '{{ requiredEnv .github.branch }}'
      commitmessage:
        title: "Bump Local Path Provisioner version"
  local-path-provisioner:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      username: "{{ .github.username }}"
      token: "{{ requiredEnv .github.token }}"
      owner: "{{ .local_path_provisioner.org }}"
      repository: "{{ .local_path_provisioner.repo }}"
      branch: "{{ .local_path_provisioner.branch }}"

actions:
  github:
    title: "[{{ requiredEnv .github.branch }}] Bump Local Path Provisioner version"
    kind: "github/pullrequest"
    scmid: "k3s"
    spec:
      merge:
        strategy: "manual"
      mergemethod: "squash"
      usetitleforautomerge: true
      labels: 
        - "dependencies"

sources:
  local-path-provisioner:
    name: "Get Local Path Provisioner latest release version"
    kind: "githubrelease"
    spec:
      owner: "{{ .local_path_provisioner.org }}"
      repository: "{{ .local_path_provisioner.repo }}"
      branch: "{{ .local_path_provisioner.branch }}"
      token: "{{ requiredEnv .github.token }}"
      versionfilter:
        kind: "latest"
  get-pwd:
    name: "Run Updatecli execution directory"
    kind: "shell"
    disablesourceinput: true
    spec:
      command: 'pwd'
      environments:
        - name: PATH

conditions:
  local-path-provisioner:
    name: "Check k3s-io/mirrored-local-path-provisioner image version in GHCR"
    kind: "dockerimage"
    sourceid: "local-path-provisioner"
    spec:
      image: "ghcr.io/k3s-io/mirrored-local-path-provisioner"

targets:
  local-path-provisioner:
    name: "Update k3s-io/mirrored-local-path-provisioner image version"
    kind: "file"
    scmid: "k3s"
    sourceid: "local-path-provisioner"
    spec:
      files:
        - "manifests/local-storage.yaml"
        - "scripts/airgap/image-list.txt"
      matchpattern: 'k3s-io/mirrored-local-path-provisioner:v\d+\.\d+\.\d+(-\w+)?'
      replacepattern: 'k3s-io/mirrored-local-path-provisioner:{{ source `local-path-provisioner` }}'
